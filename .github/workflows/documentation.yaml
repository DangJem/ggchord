name: Documentation

on:
  push:
    paths: ['website/**', 'tools/**', 'data-raw/**', 'examples/**', 'inst/**', 'data/**', 'R/**', 'man/**', 'vignettes/**', 'README*', 'MIGRATION*.md', 'LICENSE*', 'DESCRIPTION', 'NAMESPACE', '_pkgdown.yml', 'NEWS.md', '.github/workflows/documentation.yaml']
  pull_request:
    paths: ['website/**', 'tools/**', 'data-raw/**', 'examples/**', 'inst/**', 'data/**', 'R/**', 'man/**', 'vignettes/**', 'README*', 'MIGRATION*.md', 'LICENSE*', 'DESCRIPTION', 'NAMESPACE', '_pkgdown.yml', 'NEWS.md', '.github/workflows/documentation.yaml']
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy only after explicit website cutover authorization'
        type: boolean
        required: true
        default: false
      verify_incremental:
        description: 'Verify prose reuse, source/dependency invalidation and corrupt-cache fallback'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 tools/check-documentation.py --source-only

  preview:
    if: github.event_name == 'workflow_dispatch'
    needs: source-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-pandoc@v2
      - name: Identify dependency cache runtime
        id: doc-runtime
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, subprocess
          version = subprocess.check_output(['Rscript', '-e', 'cat(as.character(getRversion()))'], text=True).strip()
          release = dict(line.split('=', 1) for line in pathlib.Path('/etc/os-release').read_text().splitlines() if '=' in line)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('r=' + version + '\n')
              output.write('os=' + release['VERSION_ID'].strip('"') + '\n')
          PYTHON
      - uses: actions/cache/restore@v4
        id: doc-cache
        with:
          path: ${{ env.R_LIBS_USER }}
          key: docs-${{ runner.os }}-${{ runner.arch }}-${{ steps.doc-runtime.outputs.os }}-R${{ steps.doc-runtime.outputs.r }}-${{ hashFiles('tools/website-dependencies.R') }}
      - name: Install system headers used by reference dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libxml2-dev libssl-dev libbz2-dev liblzma-dev zlib1g-dev
      - name: Install missing website dependencies
        run: Rscript --vanilla tools/website-dependencies.R
      - uses: actions/cache/save@v4
        if: steps.doc-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ steps.doc-cache.outputs.cache-primary-key }}
      - uses: actions/cache/restore@v4
        with:
          path: .cache/website
          key: site-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            site-v1-${{ runner.os }}-${{ runner.arch }}-
      - run: python3 tools/build-website.py --render-jobs 2 --render-batch-size 12 ${{ inputs.deploy && '--publication' || '' }}
      - run: python3 tools/site_cache.py --verify-and-publish
      - name: Verify incremental behavior and restore deployment sources
        if: inputs.verify_incremental
        run: python3 tools/site-audit/verify-incremental.py
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: .cache/website
          key: site-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentation-preview
          path: .site/
          include-hidden-files: false
      - uses: actions/upload-pages-artifact@v4
        if: inputs.deploy
        with:
          path: .site/

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy the reviewed documentation artifact
        id: deployment
        uses: actions/deploy-pages@v4
