url: https://dangjem.github.io/ggchord/
destination: .site/en
lang: en
home:
  sidebar: false
template:
  bootstrap: 5
  theme: a11y-light
  theme-dark: a11y-dark
  light-switch: true
  bslib:
    base_font: system-ui
    heading_font: system-ui
    code_font: monospace
    primary: "#086D67"
    navbar-light-bg: "#FFFEFA"
    navbar-dark-bg: "#17272C"
navbar:
  structure:
    left: [home, start, plots, articles, reference]
    right: [github, lightswitch]
  components:
    home:
      text: Home
      href: index.html
    plots:
      text: Plot courses
      menu:
        - text: Chord comparisons
          href: chord-start.html
        - text: Collinear comparisons
          href: collinear-start.html
        - text: Plasmid maps
          href: plasmid-start.html
        - text: Gallery
          href: gallery.html
    start:
      text: Get started
      href: installation.html
    reference:
      text: Reference
      href: reference/index.html
    articles:
      text: Articles
      href: about.html
    gallery:
      text: Gallery
      href: gallery.html
    news:
      text: Changelog
      href: about.html#status
