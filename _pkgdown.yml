url: https://dangjem.github.io/ggchord/
destination: .site/en
lang: en
home:
  sidebar: false
template:
  bootstrap: 5
  theme: a11y-light
  theme-dark: a11y-dark
  light-switch: true
  bslib:
    base_font: system-ui
    heading_font: system-ui
    code_font: monospace
    primary: "#086D67"
    navbar-light-bg: "#FFFEFA"
    navbar-dark-bg: "#17272C"
navbar:
  structure:
    left: [start, plots, data, gallery, reference]
    right: [github, lightswitch]
  components:
    start:
      text: Get started
      href: installation.html
    plots:
      text: Plotting guide
      href: modes.html
    data:
      text: Data and workflows
      href: formats.html
    gallery:
      text: Example gallery
      href: gallery.html
    reference:
      text: API reference
      href: reference/index.html
